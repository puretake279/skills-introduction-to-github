<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>放課後デッドライン</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0f17;--p1:#141b28;--p2:#1c2535;--line:#2f3b52;--txt:#e8eef8;--dim:#8b97ab;--acc:#ffc83d;--pink:#ff6b9d;--cyan:#6fe3ff;--green:#7be07b;--red:#ff5c6a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
body{font-family:"DotGothic16","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;color:var(--txt)}
#rot{position:fixed;left:0;top:0;transform-origin:0 0;overflow:hidden;background:#05070b}
#cv{position:absolute;left:0;top:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
.ui{position:absolute;inset:0;font-size:1.3rem;line-height:1.4;display:flex;flex-direction:column}
.ui small{font-size:1.08rem;color:var(--dim)} .ui h2,.ui h3,.ui h4,.ui p{margin:0}
canvas.px{image-rendering:pixelated;image-rendering:crisp-edges;display:block;flex:none}
.face{width:3.4rem;height:3.07rem;background:color-mix(in srgb,var(--cc,#445) 35%,#0b0f17);border:.12rem solid var(--cc,#445);border-radius:.2rem}
.gun{width:10.5rem;height:3.25rem} .zi{width:4.4rem;height:4.4rem}
button{font:inherit;color:inherit}
.b{background:var(--p2);border:.15rem solid var(--line);border-radius:.3rem;padding:.55rem 1.2rem;box-shadow:0 .3rem 0 #05070b;cursor:pointer;position:relative;white-space:nowrap}
.b:active:not(:disabled){transform:translateY(.2rem);box-shadow:0 .1rem 0 #05070b}
.b.pri{background:var(--acc);color:#1a1405;border-color:#fff2c0;font-weight:bold}
.b.sm{padding:.25rem .8rem;font-size:1.15rem;box-shadow:0 .2rem 0 #05070b}
.b.xl{font-size:2rem;padding:.7rem 2.4rem} .b.red{border-color:var(--red);color:var(--red)}
.b:disabled,.tab:disabled,.df:disabled{opacity:.38;filter:grayscale(.7);cursor:default}
.coin{display:inline-block;width:1.1rem;height:1.1rem;border-radius:50%;background:#ffd23f;border:.15rem solid #7a5a00;vertical-align:-.12rem;margin-right:.35rem;box-shadow:inset .2rem .2rem 0 #fff7c0}
.cur{display:flex;gap:1.4rem;font-size:1.4rem;flex:none} .cur span{white-space:nowrap;display:flex;align-items:center}
.gr{display:inline-block;width:1rem;height:1rem;background:#8fd0ff;border-radius:.15rem;transform:rotate(45deg);margin:0 .6rem 0 .25rem;vertical-align:-.05rem;box-shadow:inset .25rem .25rem 0 #dff2ff} .cur .cr{color:#7be07b} .cur{font-size:1.2rem!important} .cur .pt{color:#8fd0ff}
.hd{flex:none;height:3.8rem;display:flex;align-items:center;gap:1.2rem;padding:0 1.2rem;background:#0b0f17;border-bottom:.4rem solid;border-image:repeating-linear-gradient(-45deg,var(--acc) 0 .8rem,#16130a .8rem 1.6rem) 4}
.hd .bk{background:none;border:.12rem solid var(--line);border-radius:.3rem;padding:.25rem .9rem;cursor:pointer;font-size:1.2rem}
.hd .ht{flex:1;font-size:1.7rem;color:var(--acc);letter-spacing:.2rem}
.s-stages,.s-team,.s-shop,.s-rec,.s-opt{background:rgba(9,12,19,.93)}
.tabs{flex:none;display:flex;gap:.4rem;padding:.6rem 1.2rem 0;border-bottom:.15rem solid var(--line)}
.tab{background:var(--p1);border:.15rem solid var(--line);border-bottom:none;border-radius:.4rem .4rem 0 0;padding:.35rem 1.1rem;cursor:pointer;line-height:1.2;text-align:center}
.tab small{display:block;font-size:.95rem!important} .tab.on{background:var(--acc);color:#1a1405;border-color:var(--acc)} .tab.on small{color:#4a3a05}
.tabs.sm{padding:0 0 0 .2rem} .tabs.sm .tab{padding:.3rem .9rem;font-size:1.2rem}
.tab.sv{margin-left:auto;border-color:var(--pink)} .tab.sv.on{background:var(--pink)}
.scroll{overflow-y:auto;overflow-x:hidden;touch-action:none;scrollbar-width:thin;scrollbar-color:var(--line) transparent;min-height:0}
.list{flex:1;padding:.8rem 1.2rem 2rem}
.row{display:flex;align-items:center;gap:1rem;background:var(--p1);border:.12rem solid var(--line);border-radius:.3rem;padding:.5rem .9rem;margin-bottom:.5rem}
.row .rm{flex:1;min-width:0} .row .rm small{display:block} .row .ds{color:#6f7b90!important}
.row .gi{width:10.5rem;flex:none;background:#0b0f17;border-radius:.3rem;padding:.3rem 0}
.row .rb{flex:none;text-align:right;max-width:16rem} .own{color:var(--green)} .lk{color:var(--dim);font-size:1.05rem}
.row.done{border-color:#3d6b3d;background:#14241a} .chk{width:1.8rem;color:var(--green);font-size:1.6rem}
.sw{width:3rem;height:3rem;border-radius:.3rem;border:.15rem solid #000;box-shadow:inset .4rem .4rem 0 rgba(255,255,255,.25)}
.st{color:#ffd23f;font-size:1rem;letter-spacing:-.1rem} .st0{color:#3a4354;font-size:1rem;letter-spacing:-.1rem}
.tag{display:inline-block;font-size:.95rem;border:.1rem solid var(--dim);color:var(--dim);border-radius:.2rem;padding:0 .4rem;margin-left:.4rem;vertical-align:.1rem} .tag.y{border-color:var(--acc);color:var(--acc)}
.hint{color:var(--dim);font-size:1.05rem;padding:.6rem .2rem}
/* title */
.title{flex:1;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;padding:0 0 0 5rem;background:linear-gradient(90deg,rgba(5,7,11,.92) 0,rgba(5,7,11,.7) 38%,rgba(5,7,11,0) 70%)}
.logo .l0{font-size:1.2rem;letter-spacing:.9rem;color:var(--acc)} .logo .l1{font-size:5.2rem;line-height:1;color:#fff;text-shadow:.3rem .3rem 0 #000;margin-top:.4rem}
.logo .l2{font-size:6.6rem;line-height:1.05;color:var(--acc);text-shadow:.35rem .35rem 0 #7a1f2a,.7rem .7rem 0 #000}
.tape{height:1.1rem;width:36rem;margin:.9rem 0 .7rem;background:repeating-linear-gradient(-45deg,var(--acc) 0 1rem,#16130a 1rem 2rem)}
.logo .l3{font-size:1.25rem;color:#dfe6f0;text-shadow:.15rem .15rem 0 #000} .title .b{margin-top:2.6rem} .title .foot{margin-top:1.4rem;font-size:1.05rem;color:var(--dim)}
.blink{animation:bl 1.1s steps(2) infinite} @keyframes bl{50%{filter:brightness(1.35)}}
/* home */
.home{flex:1;position:relative;background:linear-gradient(90deg,rgba(5,7,11,0) 55%,rgba(5,7,11,.75))}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:.8rem 1.4rem 2rem;background:linear-gradient(rgba(5,7,11,.9),rgba(5,7,11,0))}
.club b{font-size:1.7rem;color:var(--acc);letter-spacing:.15rem} .club span{display:block;font-size:1.1rem;color:#c5cedd}
.hmenu{position:absolute;right:1.6rem;top:6rem;display:flex;flex-direction:column;gap:.9rem;width:20rem}
.hmenu .b{text-align:left;font-size:1.55rem;padding:.65rem 1.3rem;background:rgba(20,27,40,.92)} .hmenu .xl{font-size:2.8rem;text-align:center;padding:.9rem;background:var(--acc)} .hmenu small{display:block;font-size:1rem!important;letter-spacing:.5rem;color:#5a4505!important}
.badge{position:absolute;right:.8rem;top:.7rem;background:var(--pink);color:#fff;font-style:normal;font-size:1rem;padding:.05rem .5rem;border-radius:.8rem}
.hteam{position:absolute;left:1.4rem;top:6.2rem;display:flex;flex-direction:column;gap:.9rem;align-items:stretch}
.tcard{display:flex;gap:.7rem;align-items:center;background:rgba(11,15,23,.88);border:.15rem solid var(--cc);border-radius:.3rem;padding:.5rem .9rem .5rem .6rem;position:relative;cursor:pointer;line-height:1.25}
.tcard .tno{position:absolute;left:-.5rem;top:-.7rem;background:var(--cc);color:#000;width:1.6rem;height:1.6rem;text-align:center;line-height:1.6rem;font-size:1.1rem;border-radius:.2rem} .tcard .pw{color:var(--acc)!important}
.bondbox{background:rgba(11,15,23,.88);border:.15rem solid var(--pink);border-radius:.3rem;padding:.25rem .9rem;color:var(--pink);display:flex;gap:.8rem;align-items:baseline;justify-content:center}
.tip{position:absolute;left:0;right:0;bottom:0;padding:.5rem 1.4rem;background:rgba(5,7,11,.85);font-size:1.1rem;color:#aab4c4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* stages */
.diffs{flex:none;display:flex;gap:.6rem;padding:.7rem 1.2rem;align-items:center}
.df{background:var(--p1);border:.15rem solid var(--line);border-radius:.3rem;padding:.2rem 1.1rem;cursor:pointer;line-height:1.2} .df small{display:block;font-size:.9rem!important} .df.on{border-color:var(--dc);color:var(--dc);box-shadow:inset 0 0 0 .1rem var(--dc)}
.chsub{margin-left:auto;color:#c5cedd;font-size:1.2rem;font-style:italic}
.drw{font-style:normal;color:var(--acc);border:.12rem solid var(--acc);border-radius:.3rem;padding:.1rem .7rem;font-size:1.1rem} .drw.got{color:var(--green);border-color:var(--green)}
.srow{flex:none;display:flex;gap:.8rem;padding:0 1.2rem}
.scard{flex:1;background:var(--p1);border:.15rem solid var(--line);border-radius:.3rem;padding:.5rem .8rem;text-align:left;cursor:pointer;position:relative;line-height:1.3;min-width:0}
.scard .sid{font-size:1.7rem;color:var(--acc)} .scard{padding:.4rem .6rem!important} .scard .snm{font-size:1.15rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .scard .stag{font-size:1rem;color:var(--dim)} .scard .sst{font-size:1.5rem;color:#3a4354;letter-spacing:.1rem} .scard .sst i{font-style:normal} .scard .sst .y{color:#ffd23f}
.scard.on{border-color:var(--acc);background:#2a2412;box-shadow:0 0 0 .1rem var(--acc)} .scard.lock{opacity:.5} .scard.t-boss .sid{color:var(--red)} .scard.t-defend .sid{color:var(--cyan)} .scard.t-sp .sid{color:var(--pink)} .scard.t-sp{border-style:dashed}
.req{color:var(--pink);font-size:1.15rem} .tmini.fix{border-color:var(--pink);cursor:default} .tmini.fix small{color:var(--pink)}
.sinfo,.surv{flex:1;display:flex;gap:1.2rem;margin:.8rem 1.2rem 1rem;padding:.8rem 1.1rem;background:var(--p1);border:.12rem solid var(--line);border-radius:.3rem;min-height:0}
.sinfo .sl{flex:1;min-width:0} .sinfo h3,.surv h3{font-size:1.5rem;color:#fff;font-weight:normal} .enem{display:flex;gap:.1rem;margin:.3rem 0;flex-wrap:nowrap;overflow:hidden} .enem .zi{width:3.5rem;height:3.5rem}
.cond{display:flex;gap:1.2rem;font-size:1.15rem;color:#56617a;flex-wrap:wrap} .cond .y{color:#ffd23f} .cond .bt{color:var(--cyan)}
.go-row{display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-end;gap:.8rem}
.tmini{display:flex;gap:.4rem;align-items:center;background:var(--p2);border:.12rem solid var(--line);border-radius:.3rem;padding:.3rem .6rem;cursor:pointer}
.surv{flex-direction:column;position:relative} .surv p{color:#c5cedd;margin:.5rem 0} .surv .best{font-size:1.5rem;color:var(--pink)} .surv .go-row{position:absolute;right:1.1rem;bottom:1rem}
/* team */
.team{flex:1;display:flex;min-height:0}
.cl{width:13.5rem;flex:none;padding:.6rem .6rem .6rem 1rem;display:flex;flex-direction:column;gap:.45rem}
.ccard{display:flex;gap:.6rem;align-items:center;background:var(--p1);border:.15rem solid var(--line);border-radius:.3rem;padding:.45rem .6rem;cursor:pointer;position:relative;text-align:left;line-height:1.25;flex:1}
.ccard small{display:block} .ccard.on{border-color:var(--cc);background:color-mix(in srgb,var(--cc) 18%,#141b28)}
.ccard .in{position:absolute;right:.3rem;top:-.5rem;background:var(--acc);color:#000;font-size:.9rem;font-style:normal;padding:0 .4rem;border-radius:.2rem} .ccard .sp{position:absolute;right:.3rem;bottom:.2rem;background:var(--pink);color:#fff;font-size:.85rem;font-style:normal;padding:0 .4rem;border-radius:.6rem}
.cmid{width:19rem;flex:none;display:flex;flex-direction:column;align-items:center;padding:.6rem .4rem;background:linear-gradient(color-mix(in srgb,var(--cc) 22%,transparent),transparent 70%);border-left:.12rem solid var(--line);border-right:.12rem solid var(--line)}
.cname{text-align:center;line-height:1.3} .cname b{font-size:1.7rem;color:var(--cc)} .cname small{display:block}
.big{width:18rem;height:16.5rem;margin:-.4rem 0 -.2rem} .inteam{color:var(--acc);font-size:1.15rem;display:flex;gap:.6rem;align-items:center} .swapask{display:flex;gap:.4rem;align-items:center}
.cright{flex:1;min-width:0;display:flex;flex-direction:column;padding:.6rem .8rem 0 .6rem}
.tb{flex:1;padding:.6rem .3rem 2rem .1rem}
.prof{color:#c5cedd;font-size:1.15rem;margin-bottom:.5rem!important}
.xp{display:flex;gap:.7rem;align-items:center;font-size:1.1rem;margin-bottom:.5rem} .bar{flex:1;height:.7rem;background:#0b0f17;border:.1rem solid var(--line);border-radius:.2rem;overflow:hidden} .bar i{display:block;height:100%;background:var(--cyan)}
.grid2,.grid3{display:grid;grid-template-columns:1fr 1fr;gap:.35rem .8rem;margin-bottom:.6rem} .grid3{grid-template-columns:1fr 1fr 1fr} .grid2.wide{grid-template-columns:1fr 1fr 1fr}
.grid2>div,.grid3>div{display:flex;justify-content:space-between;background:var(--p1);border-radius:.2rem;padding:.2rem .7rem;color:var(--dim);font-size:1.15rem} .grid2 b,.grid3 b{color:#fff;font-weight:normal}
.box{background:var(--p1);border-left:.3rem solid var(--acc);border-radius:.2rem;padding:.4rem .8rem;margin-bottom:.5rem;font-size:1.15rem;color:#c5cedd} .box h4{color:var(--acc);font-weight:normal;font-size:1.15rem} .box h4 small{margin-left:.6rem}
.wrow{display:flex;gap:.5rem;align-items:center;margin-bottom:.45rem}
.wmain{flex:1;min-width:0;display:flex;gap:.7rem;align-items:center;background:var(--p1);border:.15rem solid var(--line);border-radius:.3rem;padding:.35rem .6rem;cursor:pointer;text-align:left;position:relative;line-height:1.3}
.wmain .gi{width:8.4rem;flex:none} .wmain .gun{width:8.4rem;height:2.6rem} .wmain .rm{min-width:0} .wmain .rm small{display:block} .wmain .lv{display:inline!important;color:var(--cyan)!important}
.wrow.on .wmain{border-color:var(--acc);background:#2a2412} .eq{position:absolute;right:.4rem;top:.2rem;font-style:normal;font-size:.95rem;color:var(--acc)}
.wc .wtop{display:flex;gap:1rem;align-items:center;margin:.5rem 0;line-height:1.35} .gbig{background:#0b0f17;border:.12rem solid var(--line);border-radius:.3rem;padding:.6rem .4rem;flex:none} .gbig .gun{width:15rem;height:4.64rem}
.uprow{display:flex;justify-content:space-between;align-items:center;background:var(--p1);border:.12rem solid var(--cyan);border-radius:.3rem;padding:.4rem .8rem;margin-bottom:.5rem}
.aslot{margin-bottom:.4rem} .arow{width:100%;display:flex;gap:.8rem;align-items:center;background:var(--p1);border:.15rem solid var(--line);border-radius:.3rem;padding:.4rem .8rem;cursor:pointer;text-align:left}
.arow .sl,.paints .sl{width:5.2rem;flex:none;color:var(--acc);font-size:1.1rem} .arow b{font-weight:normal;white-space:nowrap} .arow small{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .arow i{font-style:normal;color:var(--dim);font-size:.9rem}
.aslot.open .arow{border-color:var(--acc)} .alist{display:grid;grid-template-columns:1fr 1fr;gap:.35rem;padding:.4rem 0 .2rem 1rem}
.aopt{background:var(--p2);border:.12rem solid var(--line);border-radius:.3rem;padding:.3rem .7rem;cursor:pointer;text-align:left;line-height:1.3} .aopt small{display:block} .aopt b{font-weight:normal} .aopt.on{border-color:var(--acc);color:var(--acc)}
.paints{display:flex;gap:.5rem;align-items:center;padding:.4rem .8rem;flex-wrap:wrap}
.spbar{display:flex;align-items:center;gap:1rem;margin-bottom:.5rem;color:var(--pink)} .spbar b{font-size:1.8rem} .spbar .b{margin-left:auto;color:var(--txt)}
.perk{display:flex;align-items:center;gap:.8rem;background:var(--p1);border:.12rem solid var(--line);border-radius:.3rem;padding:.35rem .8rem;margin-bottom:.4rem} .perk>div:first-child{flex:1} .perk b{font-weight:normal} .perk small{display:block}
.pips{display:flex;gap:.25rem} .pips i,.vbar i{width:.9rem;height:1.2rem;background:#0b0f17;border:.1rem solid var(--line)} .pips i.y,.vbar i.y{background:var(--acc);border-color:var(--acc)}
/* records / options */
.dex{display:grid;grid-template-columns:1fr 1fr;gap:.5rem} .dcard{display:flex;gap:.8rem;background:var(--p1);border:.12rem solid var(--line);border-radius:.3rem;padding:.5rem .8rem;line-height:1.3} .dcard small{display:block} .dcard.boss{border-color:#7a2e3a} .dcard .ttl{color:var(--red)!important} .dcard .kc{color:var(--acc)!important}
.sub{color:var(--acc);font-weight:normal;margin:.8rem 0 .4rem!important} .bonds{display:grid;grid-template-columns:1fr 1fr;gap:.4rem} .bonds>div{background:var(--p1);border-radius:.2rem;padding:.3rem .7rem;display:flex;gap:.7rem;align-items:baseline} .bonds b{color:var(--pink);font-weight:normal;margin-left:auto}
.opt .orow{display:flex;gap:.8rem;align-items:center;margin-bottom:.7rem;flex-wrap:wrap} .orow>span:first-child{width:9rem} .orow .gap{width:2rem!important} .vbar{display:flex;gap:.2rem}
.opt textarea{width:100%;height:5.5rem;background:#05070b;color:var(--cyan);border:.12rem solid var(--line);border-radius:.3rem;font:1rem monospace;padding:.4rem;margin:.5rem 0;user-select:text;-webkit-user-select:text;resize:none;word-break:break-all}
/* pause, story, result */
.s-pause{background:rgba(5,7,11,.78);align-items:center;justify-content:center} .pausebox{display:flex;flex-direction:column;gap:1rem;align-items:stretch;min-width:26rem;text-align:center} .pausebox h2{font-size:3rem;color:var(--acc);letter-spacing:.8rem;font-weight:normal}
.story{flex:1;position:relative;background:linear-gradient(rgba(5,7,11,.35),rgba(5,7,11,.8));cursor:pointer} .skip{position:absolute;right:1.2rem;top:1.2rem}
.sbox{position:absolute;left:5%;right:5%;bottom:1.6rem;min-height:10.5rem;background:rgba(9,12,19,.94);border:.2rem solid var(--cc,#fff);border-radius:.4rem;padding:1.6rem 1.6rem 1.2rem 10.5rem;font-size:1.65rem;line-height:1.55}
.sface{position:absolute;left:1.2rem;top:1.2rem} .sface .face{width:7.6rem;height:6.87rem;border-width:.2rem}
.sname{position:absolute;left:1rem;top:-1.6rem;background:var(--cc,#fff);color:#05070b;padding:.05rem 1.2rem;font-size:1.35rem;border-radius:.2rem} .sname:empty{display:none}
.stext{white-space:pre-wrap} .snx{position:absolute;right:1.2rem;bottom:.5rem;color:var(--acc);animation:bl .8s steps(2) infinite}
.sbox.narr{--cc:#8b97ab;padding-left:1.8rem;text-align:center;color:#dfe6f0;font-style:italic;display:flex;align-items:center;justify-content:center}
.s-result{background:rgba(5,7,11,.86)} .result{flex:1;display:flex;flex-direction:column;padding:1rem 2.4rem 1.2rem;min-height:0}
.asave{display:inline-block;margin:.3rem auto 0;padding:.1rem .9rem;border-radius:1rem;background:rgba(123,224,123,.14);color:var(--green);font-size:1.05rem;animation:tin .4s .5s both} .asave.ng{background:rgba(255,92,106,.14);color:var(--red)}
.rhead{text-align:center} .rhead h2{font-size:3.2rem;letter-spacing:.5rem;font-weight:normal;color:var(--acc);text-shadow:.3rem .3rem 0 #000;line-height:1.1} .lose .rhead h2{color:var(--red)} .rsub{color:#c5cedd} .rsub b{color:var(--pink);font-size:2rem}
.rstars{display:flex;justify-content:center;gap:2.4rem;margin:.2rem 0} .rstars>div{text-align:center;color:#3a4354;animation:pop .4s both} .rstars i{font-style:normal;font-size:3.4rem;line-height:1;display:block} .rstars .y{color:#ffd23f} .rstars .y small{color:#fff} @keyframes pop{0%{transform:scale(2.4);opacity:0}100%{transform:scale(1);opacity:1}}
.rbody{flex:1;display:flex;gap:1.6rem;min-height:0;margin-top:.5rem} .rl,.rr{flex:1;min-width:0}
.rew{display:flex;gap:1rem;flex-wrap:wrap} .rew>div{background:var(--p1);border:.12rem solid var(--line);border-radius:.3rem;padding:.4rem 1rem;flex:1} .rew b{font-size:1.6rem;color:#7be07b} .rew small{display:block} .rew .bu{flex-basis:100%;color:var(--pink);border-color:var(--pink);text-align:center}
.xrow{display:flex;gap:.8rem;align-items:center;background:var(--p1);border-radius:.3rem;padding:.3rem .8rem;margin-bottom:.4rem;line-height:1.3} .xrow>div{flex:1} .xrow.bench{opacity:.6} .xrow b{color:var(--cc)}
.new{font-style:normal;background:var(--pink);color:#fff;font-size:.95rem;padding:0 .5rem;border-radius:.2rem;animation:bl .5s steps(2) infinite}
.rach{background:#2a2412;border:.12rem solid var(--acc);border-radius:.3rem;padding:.25rem .9rem;margin-top:.4rem;display:flex;gap:.8rem;align-items:baseline} .rach b{color:var(--acc);font-weight:normal} .rach small{margin-left:auto}
.row.unk{opacity:.55;border-style:dashed} .chips{display:flex;gap:.3rem;margin-bottom:.5rem;flex-wrap:wrap} .chip{background:var(--p1);border:.12rem solid var(--line);border-radius:1rem;padding:.1rem .8rem;font-size:1.1rem;cursor:pointer} .chip.on{background:var(--acc);color:#1a1405;border-color:var(--acc)} .chips small{align-self:center;margin-left:.5rem}
.loot{margin-top:.5rem} .lt{display:flex;gap:.7rem;align-items:center;background:var(--p1);border:.12rem solid var(--line);border-radius:.3rem;padding:.25rem .7rem;margin-bottom:.3rem;line-height:1.25;opacity:.6} .lt .gun{width:7.4rem;height:2.3rem} .lt>div{flex:1;min-width:0} .lt small{display:block} .lt.nw{opacity:1;border-color:#3d9b4a;background:#122416} .rew .ap{color:#ff8a8a!important} .rew .gb{color:#8fc0ff!important} .lt.ar.nw{border-color:#2f6fb5;background:#101c2e}
.rbtn{display:flex;justify-content:center;gap:1.2rem;margin-top:.6rem}
#toast{position:absolute;left:0;right:0;top:4.4rem;display:flex;flex-direction:column;align-items:center;gap:.5rem;pointer-events:none;font-size:1.25rem;z-index:5}
.toast{background:rgba(9,12,19,.95);border:.15rem solid var(--cyan);border-radius:.3rem;padding:.4rem 1.4rem;text-align:center;animation:tin .25s both;line-height:1.35} .toast.ach{border-color:var(--acc)} .toast b{color:var(--acc)} .toast small{font-size:1.05rem;color:#c5cedd} .toast.out{opacity:0;transition:opacity .4s} @keyframes tin{0%{transform:translateY(-1.5rem);opacity:0}}
#modal{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(5,7,11,.75);font-size:1.4rem;z-index:6}
.mbox{background:var(--p1);border:.2rem solid var(--acc);border-radius:.4rem;padding:1.6rem 2.2rem;max-width:42rem;text-align:center} .mbtn{display:flex;gap:1.2rem;justify-content:center;margin-top:1.4rem}
#load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:1.6rem;color:var(--acc);background:#05070b;z-index:9}

.fx{display:block;color:#7fd6e8!important;white-space:normal} .wmain .ds{color:#8a95a8!important;white-space:normal} .lt .fx{font-size:.85em}
.autoeq{display:flex;gap:.4rem;justify-content:center;margin-top:.4rem} .automsg{display:block;text-align:center;color:var(--cyan);margin-top:.2rem}
.cl{color:var(--acc)} .cl.on{color:#7fe08a} .cl.off{color:#ff8a8a}
</style>
</head>

function weaponFeats(w) {

  if (w.ex) f.push(w.ex);

  if (w.beam) f.push('射線上の敵をすべて貫く光線を撃つ');
  if (w.spin) f.push('撃ち始めに銃身の回転を待つ時間がある');
  if (w.expl) f.push((w.plasma ? '敵を貫通しながら爆発するプラズマ弾' : w.arc ? '山なりに飛んで爆発するてき弾' : 'まっすぐ飛んで爆発するロケット弾') + '（爆発範囲' + w.expl + '）');
  else if (w.pierce && !w.beam) f.push('弾が敵を' + (w.pierce > 20 ? '何体でも' : w.pierce + '体まで') + '貫通する');
  return f;
}

function tintHex(hex, to, ref) {
  if (typeof hex !== 'string' || hex[0] !== '#') return hex;
  const p = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)], lum = c => (c[0] * 0.3 + c[1] * 0.59 + c[2] * 0.11) / 255;
  const c = p(hex), t = p(to), k = Math.max(0.35, Math.min(1.6, lum(c) / Math.max(0.15, ref))), mx = Math.max(...c), mn = Math.min(...c);
  if (mx - mn < 18 && (mx > 235 || mx < 50)) return hex;   // keep pure white / black details
  return '#' + t.map(v => Math.max(0, Math.min(255, Math.round(v * k))).toString(16).padStart(2, '0')).join('');
}

  const cols = []; if (b.ov) for (const g in b.ov) b.ov[g].forEach(r => { if (typeof r[4] === 'string' && r[4][0] === '#') cols.push([r[4], r[2] * r[3]]); });
  let main = b.col || b.skirt || null; if (!main && cols.length) { const m = {}; cols.forEach(([c, n]) => { m[c] = (m[c] || 0) + n; }); main = Object.keys(m).sort((x, y) => m[y] - m[x])[0]; }
  const pm = main ? [parseInt(main.slice(1, 3), 16), parseInt(main.slice(3, 5), 16), parseInt(main.slice(5, 7), 16)] : [128, 128, 128], ref = (pm[0] * 0.3 + pm[1] * 0.59 + pm[2] * 0.11) / 255;
  ARMOR_VARS.forEach(([nm, col, lvAdd, mul], i) => {
    const v = Object.assign({}, b, { name: b.name + '（' + nm + '）', lvAdd, base: k, st: {} });
    for (const s in b.st) v.st[s] = b.st[s] < 0 ? b.st[s] : Math.round(b.st[s] * mul * 10) / 10;
    if (b.ov) { v.ov = {}; for (const g in b.ov) v.ov[g] = b.ov[g].map(r => { const q = r.slice(); q[4] = tintHex(r[4], col, ref); return q; }); }

    ARMOR[k + '.' + (i + 1)] = v;
  });
});

    let xp = res.xp, wbox = res.wbox || 0, abox = res.abox || 0, gbox = res.gbox || 0; const L = cfg.survival ? Math.round(res.wave * 1.5) + 1 : stage.lv + diff.lv;

      stz.forEach((ok, i) => { if (ok && !r.stars[i]) { r.stars[i] = true; out.newStars.push(i); wbox++; } });

    } else { xp = Math.round(xp * 0.5); wbox = Math.floor(wbox / 2); abox = Math.floor(abox / 2); gbox = Math.floor(gbox / 2); }
